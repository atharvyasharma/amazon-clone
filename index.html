<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.com. Spend less. Smile more.</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f3f3;
        }
        header {
            background-color: #232f3e;
            color: white;
            padding: 10px;
            display: flex;
            align-items: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-right: 20px;
        }
        nav {
            flex: 1;
        }
        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }
        nav ul li {
            margin-right: 15px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
        }
        .search-bar {
            flex: 2;
            background-color: white;
            border-radius: 4px;
            padding: 5px;
        }
        .main-content {
            text-align: center;
            padding: 50px;
            font-size: 48px;
            color: #ff0000;
            background-color: #ffffff;
            margin: 20px;
            border: 1px solid #ddd;
        }
        footer {
            background-color: #232f3e;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Amazon</div>
        <nav>
            <ul>
                <li><a href="#">Hello, sign in</a></li>
                <li><a href="#">Returns & Orders</a></li>
                <li><a href="#">Cart</a></li>
            </ul>
        </nav>
        <div class="search-bar">
            <input type="text" placeholder="Search Amazon" style="width: 80%; border: none;">
            <button>Search</button>
        </div>
    </header>
    <div class="main-content">
        FUCK YOU
    </div>
    <footer>
        &copy; 1996-2026, Amazon.com, Inc. or its affiliates
    </footer>
</body>
</html>
